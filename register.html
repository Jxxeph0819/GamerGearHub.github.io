<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GamerGear Hub - Sign Up</title>
    <link rel="stylesheet" href="css_index.html/c.css">
</head>
<body>

    <div class="login-box">
        <img class="logo" src="imagenes/logo.png" alt="GamerGear Hub">

        <h1>sign up</h1>

        <form action="login.html" method="get">
            <label for="email">email:</label>
            <input type="email" id="email" name="email" placeholder="ingresa tu correo" required>

            <label for="nombre">display Name:</label>
            <input type="text" id="nombre" name="nombre" placeholder="ingrese tu nombre" required>

            <label for="password">password:</label>
            <input type="password" id="password" name="password" placeholder="crea una contraseña" required>

            <label for="password2">confirm Password:</label>
            <input type="password" id="password2" name="password2" placeholder="repite tu contraseña" required>

            <button type="submit">create account</button>
        </form>

        <p>¿ya tienes cuenta? <a href="login.html">inicia sesión</a></p>
    </div>

</body>
</html>
